<script id="aab-v6-fixes">
// AABStudio v6 Professional Fixes — fully quote-safe
window.closeShortcutsModal=function(){var m=document.getElementById('shortcuts-modal');if(m)m.style.display='none';window._shortcutsModalOpen=false;};
window.aps_stopAll=function(){if(typeof APS!=='undefined'){APS.stopRequested=true;APS.running=false;}if(typeof toast==='function')toast('Generation stopped','warn');};
window.initCamera=function(){if(typeof startCamera==='function')startCamera();};
window.renderExportPage=function(){var clips=Object.values(PROJECT.clips||{}).filter(function(c){return c&&(c.url||c.videoUrl);});var el=document.getElementById('export-stats');if(el)el.textContent=clips.length+' clips ready';};
window.cycleSceneType=function(id){var types=['INTRO','MAIN','TRANSITION','CONCLUSION'];var sc=PROJECT.scenes&&PROJECT.scenes.find(function(s){return s.id===id;});if(!sc)return;sc.type=types[(types.indexOf(sc.type||'MAIN')+1)%types.length];if(typeof saveProject==='function')saveProject();if(typeof renderSceneBoard==='function')renderSceneBoard();};
window.updateClipProp=function(prop,val){if(!TL||!TL.selectedClip)return;TL.tracks&&TL.tracks.forEach(function(t){t.clips&&t.clips.forEach(function(c){if(c.id===TL.selectedClip)c[prop]=val;});});if(typeof tl_render==='function')tl_render();};
window.showInspector=function(clip){
  var panel=document.getElementById('inspector-panel')||document.querySelector('.inspector');
  if(!panel)return;
  if(!clip){panel.innerHTML='<div style="padding:20px;text-align:center;color:rgba(255,255,255,.3);"><div style="font-size:32px;">🗒</div><div style="margin-top:8px;font-size:12px;">Select a clip to inspect</div></div>';return;}
  var html='<div style="padding:16px;">';
  html+='<div style="font-size:11px;font-weight:700;color:#00d4ff;text-transform:uppercase;letter-spacing:.05em;margin-bottom:14px;">CLIP PROPERTIES</div>';
  html+='<label style="font-size:11px;color:rgba(255,255,255,.5);">Name</label>';
  html+='<div style="font-size:13px;color:#e2e8f0;margin-bottom:12px;">'+(clip.label||'Clip')+'</div>';
  html+='<label style="font-size:11px;color:rgba(255,255,255,.5);">Duration (s)</label>';
  html+='<input data-prop="duration" type="number" value="'+(clip.duration||0).toFixed(1)+'" step="0.1" min="0" class="insp-input" style="width:100%;padding:5px 8px;background:#1e293b;border:1px solid rgba(255,255,255,.15);border-radius:4px;color:#e2e8f0;font-size:12px;margin-bottom:10px;display:block;">';
  html+='<label style="font-size:11px;color:rgba(255,255,255,.5);">Start (s)</label>';
  html+='<input data-prop="start" type="number" value="'+(clip.start||0).toFixed(2)+'" step="0.1" min="0" class="insp-input" style="width:100%;padding:5px 8px;background:#1e293b;border:1px solid rgba(255,255,255,.15);border-radius:4px;color:#e2e8f0;font-size:12px;margin-bottom:10px;display:block;">';
  html+='<label style="font-size:11px;color:rgba(255,255,255,.5);">Trim in (s)</label>';
  html+='<input data-prop="trimIn" type="number" value="'+(clip.trimIn||0).toFixed(2)+'" step="0.1" min="0" class="insp-input" style="width:100%;padding:5px 8px;background:#1e293b;border:1px solid rgba(255,255,255,.15);border-radius:4px;color:#e2e8f0;font-size:12px;margin-bottom:10px;display:block;">';
  html+='<label style="font-size:11px;color:rgba(255,255,255,.5);">Trim out (s)</label>';
  html+='<input data-prop="trimOut" type="number" value="'+(clip.trimOut||0).toFixed(2)+'" step="0.1" min="0" class="insp-input" style="width:100%;padding:5px 8px;background:#1e293b;border:1px solid rgba(255,255,255,.15);border-radius:4px;color:#e2e8f0;font-size:12px;margin-bottom:14px;display:block;">';
  html+='<button class="insp-delete" style="width:100%;padding:8px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:6px;color:#ef4444;font-size:12px;cursor:pointer;margin-bottom:8px;">🗑 Delete clip</button>';
  html+='<button class="insp-preview" style="width:100%;padding:8px;background:rgba(0,212,255,.08);border:1px solid rgba(0,212,255,.2);border-radius:6px;color:#00d4ff;font-size:12px;cursor:pointer;">▶ Preview clip</button>';
  html+='</div>';
  panel.innerHTML=html;
  // Wire inputs via event delegation (no inline quotes)
  panel.querySelectorAll('.insp-input').forEach(function(inp){
    inp.oninput=function(){updateClipProp(this.dataset.prop,parseFloat(this.value)||0);};
  });
  panel.querySelector('.insp-delete') && (panel.querySelector('.insp-delete').onclick=function(){if(typeof tl_deleteSelected==='function')tl_deleteSelected();});
  panel.querySelector('.insp-preview') && (panel.querySelector('.insp-preview').onclick=function(){
    var url=clip.url||clip.videoUrl;
    var v=document.getElementById('edit-video');
    if(v&&url){v.src=url;v.style.display='block';v.play().catch(function(){});}
  });
};
setInterval(function(){
  if(typeof TL==='undefined'||!TL||!TL.selectedClip||TL._lastInsp===TL.selectedClip)return;
  TL._lastInsp=TL.selectedClip;
  var clip=null;
  TL.tracks&&TL.tracks.forEach(function(t){t.clips&&t.clips.forEach(function(c){if(c.id===TL.selectedClip)clip=c;});});
  TL.selectedClipObj=clip;
  if(clip&&typeof showInspector==='function')showInspector(clip);
},300);
window.doExportCreatomate=async function(fmt,res){
  fmt=fmt||'mp4';res=res||'1080';
  var clips=Object.values(PROJECT.clips||{}).filter(function(c){return c&&(c.url||c.videoUrl);});
  if(!clips.length){if(typeof toast==='function')toast('No clips to export','error');return;}
  clips.sort(function(a,b){return(a.sceneNum||0)-(b.sceneNum||0);});
  var btn=document.getElementById('export-btn-creatomate');
  if(btn){btn.disabled=true;btn.textContent='Exporting…';}
  try{
    var r=await fetch(API+'/api/creatomate/stitch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({clips:clips.map(function(c){return{url:c.url||c.videoUrl,duration:c.duration||8};}),outputFormat:fmt,resolution:res+'p',title:PROJECT.title||'My Video'})});
    var d=await r.json();
    if(d.error)throw new Error(d.error);
    if(typeof toast==='function')toast('Export started…','info');
    var poll=setInterval(async function(){
      try{var sr=await fetch(API+'/api/creatomate/status/'+d.taskId);var sd=await sr.json();
        if(sd.outputUrl||sd.status==='succeeded'){clearInterval(poll);var a=document.createElement('a');a.href=sd.outputUrl;a.download=(PROJECT.title||'video').replace(/[^a-z0-9]/gi,'-')+'.'+fmt;a.click();if(typeof toast==='function')toast('✅ Export complete','ok');if(btn){btn.disabled=false;btn.textContent='Export →';}}
        else if(sd.status==='failed'){clearInterval(poll);throw new Error('Render failed');}
      }catch(e){clearInterval(poll);}
    },5000);
  }catch(e){if(typeof toast==='function')toast('Export: '+e.message,'error');if(btn){btn.disabled=false;btn.textContent='Export →';}if(typeof doExport==='function')doExport();}
};
window.renderExportOptions=function(){
  var c=document.getElementById('export-format-options');if(!c)return;
  var fmts=[{id:'mp4-1080',l:'1080p MP4',d:'YouTube, LinkedIn'},{id:'mp4-720',l:'720p MP4',d:'Smaller file'},{id:'mp4-4k',l:'4K MP4',d:'Max quality'},{id:'webm-1080',l:'WebM 1080p',d:'Web optimised'}];
  var sel=window._selFmt||'mp4-1080';
  var html='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;">';
  fmts.forEach(function(f){var on=sel===f.id;html+='<div class="fmt-opt" data-fid="'+f.id+'" style="padding:12px;background:'+(on?'rgba(0,212,255,.12)':'rgba(255,255,255,.04)')+';border:1px solid '+(on?'rgba(0,212,255,.6)':'rgba(255,255,255,.1)')+';border-radius:8px;cursor:pointer;"><div style="font-size:12px;font-weight:700;color:'+(on?'#00d4ff':'#e2e8f0')+';margin-bottom:2px;">'+f.l+'</div><div style="font-size:10px;color:#64748b;">'+f.d+'</div></div>';});
  html+='</div>';
  html+='<button class="export-go-btn" style="width:100%;padding:13px;background:linear-gradient(135deg,#00d4ff,#0070f3);border:none;border-radius:8px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:8px;">⬇ Export '+sel.replace('-',' ').toUpperCase()+'</button>';
  html+='<button class="export-quick-btn" style="width:100%;padding:9px;background:transparent;border:1px solid rgba(255,255,255,.12);border-radius:8px;color:#94a3b8;font-size:12px;cursor:pointer;">⇩ Quick download (clips)</button>';
  c.innerHTML=html;
  c.querySelectorAll('.fmt-opt').forEach(function(el){el.onclick=function(){window._selFmt=this.dataset.fid;window.renderExportOptions();};});
  c.querySelector('.export-go-btn').onclick=function(){var p=(window._selFmt||'mp4-1080').split('-');window.doExportCreatomate(p[0],p[1]);};
  c.querySelector('.export-quick-btn').onclick=function(){if(typeof doExport==='function')doExport();};
};
window.showKeyboardShortcuts=function(){
  var ex=document.getElementById('shortcuts-modal');
  if(ex){ex.style.display=ex.style.display==='none'?'flex':'none';window._shortcutsModalOpen=ex.style.display!=='none';return;}
  var m=document.createElement('div');m.id='shortcuts-modal';
  m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:9999;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);';
  m.onclick=function(e){if(e.target===m)closeShortcutsModal();};
  var rows=[['Space/K','Play/Pause'],['J','Rewind 5s'],['L','Forward 5s'],['Ctrl+B','Split clip'],['Delete','Remove clip'],['Ctrl+Z','Undo'],['Ctrl+S','Save'],['F','Fullscreen TP'],['M','Mirror TP'],['?','Show shortcuts']];
  var rowHtml=rows.map(function(r){return '<div style="display:flex;justify-content:space-between;padding:7px 10px;background:rgba(255,255,255,.04);border-radius:5px;margin-bottom:3px;"><span style="font-size:12px;color:#94a3b8;">'+r[0]+'</span><span style="background:#1e293b;border:1px solid rgba(255,255,255,.15);border-radius:4px;padding:1px 8px;font-size:11px;color:#e2e8f0;">'+r[1]+'</span></div>';}).join('');
  m.innerHTML='<div style="background:#0f172a;border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:24px;width:420px;max-height:80vh;overflow-y:auto;"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;"><div style="font-size:15px;font-weight:700;color:#fff;">Keyboard Shortcuts</div><button class="sc-close-btn" style="background:none;border:none;color:#94a3b8;font-size:20px;cursor:pointer;padding:0;">&#215;</button></div>'+rowHtml+'</div>';
  document.body.appendChild(m);
  m.querySelector('.sc-close-btn').onclick=closeShortcutsModal;
  window._shortcutsModalOpen=true;
};
if(!window._aabKbInstalled){window._aabKbInstalled=true;document.addEventListener('keydown',function(e){if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.isContentEditable)return;var k=e.key.toLowerCase(),c=e.ctrlKey||e.metaKey;if(c&&k==='z'){if(typeof editUndo==='function')editUndo();e.preventDefault();}if(c&&k==='s'){if(typeof saveProject==='function')saveProject();e.preventDefault();}if(c&&k==='b'){if(typeof tl_splitAtPlayhead==='function')tl_splitAtPlayhead();e.preventDefault();}if(k==='k'&&!c&&typeof editPlayPause==='function')editPlayPause();if(k==='j'&&!c&&typeof editSeek==='function')editSeek(-5);if(k==='l'&&!c&&typeof editSeek==='function')editSeek(5);if((k==='delete'||k==='backspace')&&typeof TL!=='undefined'&&TL&&TL.selectedClip&&typeof tl_deleteSelected==='function')tl_deleteSelected();if(k==='f'&&!c&&typeof tpFullscreen==='function')tpFullscreen();if(k==='m'&&!c&&typeof tpMirror==='function')tpMirror();if(k==='?')showKeyboardShortcuts();if(k==='escape')closeShortcutsModal();});}
window.edit_setTool=function(t){if(typeof tl_setTool==='function')tl_setTool(t);if(typeof TL!=='undefined')TL.tool=t;document.querySelectorAll('[data-tool]').forEach(function(b){b.style.background=b.dataset.tool===t?'rgba(0,212,255,.2)':'';b.style.color=b.dataset.tool===t?'#00d4ff':'';});};
window.generateProjectThumbnail=function(id,url){if(!url||url.startsWith('blob:'))return;var v=document.createElement('video');v.crossOrigin='anonymous';v.src=url;v.currentTime=1;v.addEventListener('seeked',function(){try{var c=document.createElement('canvas');c.width=320;c.height=180;c.getContext('2d').drawImage(v,0,0,320,180);var t=c.toDataURL('image/jpeg',.7);try{localStorage.setItem('aab_thumb_'+id,t);}catch(e){}document.querySelectorAll('[data-project-thumb="'+id+'"]').forEach(function(el){el.src=t;});}catch(e){}},{once:true});};
window.setStudioBackground=function(type){document.querySelectorAll('[data-bg]').forEach(function(b){b.style.background='';b.style.color='';b.style.borderColor='';});var ab=document.querySelector('[data-bg="'+type+'"]');if(ab){ab.style.background='rgba(0,212,255,.2)';ab.style.color='#00d4ff';ab.style.borderColor='#00d4ff';}if(typeof applyStudioBackground==='function')applyStudioBackground(type);if(typeof STUDIO!=='undefined')STUDIO.currentBg=type;};
window.updateRecordingProgress=function(){if(typeof PROJECT==='undefined')return;var total=(PROJECT.scenes||[]).length,rec=(PROJECT.scenes||[]).filter(function(s){return s.status==='recorded';}).length;var el=document.getElementById('studio-scene-progress');if(el&&total>0){el.textContent=rec+'/'+total+' recorded';el.style.color=rec===total?'#10b981':'#94a3b8';}};
setInterval(window.updateRecordingProgress,2000);
if(typeof showSaveStatus!=='function'){window.showSaveStatus=function(msg,type){var el=document.getElementById('aab-save-bar');if(!el){el=document.createElement('div');el.id='aab-save-bar';el.style.cssText='position:fixed;bottom:14px;right:18px;z-index:9999;font-size:11px;padding:6px 14px;border-radius:20px;transition:opacity .5s;opacity:0;pointer-events:none;box-shadow:0 2px 12px rgba(0,0,0,.4);';document.body.appendChild(el);}var col={ok:'#10b981',info:'rgba(15,23,42,.95)',warn:'#f59e0b',error:'#ef4444'};el.style.background=col[type]||col.info;el.style.color=type==='warn'?'#000':'#fff';el.textContent=msg;el.style.opacity='1';clearTimeout(el._t);el._t=setTimeout(function(){el.style.opacity='0';},3000);};}
var _aabNavO=window.nav;if(typeof _aabNavO==='function'&&!window._navMP){window._navMP=true;window.nav=function(p){_aabNavO.apply(this,arguments);if(p==='record-pg'){var pg=document.getElementById('record-pg');if(pg){pg.style.display='flex';pg.removeAttribute('hidden');}}if(p==='export-pg'){setTimeout(function(){if(typeof renderExportOptions==='function')renderExportOptions();},150);}};}
var _origSC2=window.startCamera;window.startCamera=async function(){if(typeof STUDIO!=='undefined'&&!STUDIO.stream){try{var s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:true});STUDIO.stream=s;var v=document.getElementById('studio-video')||document.querySelector('.studio-canvas video');if(v){v.srcObject=s;v.style.transform='';}return s;}catch(e){console.warn('camera fallback:',e.message);}}if(typeof _origSC2==='function')return _origSC2.apply(this,arguments);};
var _otta=window.tpToggleAdaptive;if(typeof _otta==='function'){window.tpToggleAdaptive=function(){_otta.apply(this,arguments);setTimeout(function(){var b=document.querySelector('[onclick*="tpToggleAdaptive"]');if(b&&typeof TP_ADAPTIVE!=='undefined'){b.textContent=TP_ADAPTIVE?'\u270F Adaptive: on':'\u270F Adaptive: off';b.style.color=TP_ADAPTIVE?'#00d4ff':'';}},50);};}
if(typeof doExport!=='function'){window.doExport=async function(){var clips=Object.values(PROJECT.clips||{}).filter(function(c){return c&&(c.url||c.videoUrl);});if(!clips.length){if(typeof toast==='function')toast('No clips to export','error');return;}clips.sort(function(a,b){return(a.sceneNum||0)-(b.sceneNum||0);});try{var bufs=await Promise.all(clips.map(function(c){return fetch(c.url||c.videoUrl).then(function(r){return r.arrayBuffer();});}));var tot=bufs.reduce(function(s,b){return s+b.byteLength;},0),out=new Uint8Array(tot),off=0;bufs.forEach(function(b){out.set(new Uint8Array(b),off);off+=b.byteLength;});var url=URL.createObjectURL(new Blob([out],{type:'video/webm'}));var a=document.createElement('a');a.href=url;a.download=(PROJECT.title||'video').replace(/[^a-z0-9]/gi,'-')+'-export.webm';a.click();setTimeout(function(){URL.revokeObjectURL(url);},30000);if(typeof toast==='function')toast('\u2705 Export downloaded','ok');}catch(e){clips.forEach(function(c,i){setTimeout(function(){var a=document.createElement('a');a.href=c.url||c.videoUrl;a.download='scene-'+(c.sceneNum||i+1)+'.webm';a.click();},i*700);});if(typeof toast==='function')toast('Downloaded clips individually','info');}};}
console.log('AABStudio v6 fixes loaded \u2713');
</script>
